<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>PronoStats</title>
<style>
:root{color-scheme:light dark;--ac:#12a150}
body{font:15px/1.45 system-ui,sans-serif;max-width:640px;margin:0 auto;padding:14px}
.c{border:1px solid #8884;border-radius:14px;padding:14px;margin:12px 0}
input,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #8886;margin:4px 0;width:100%}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
small{opacity:.7}
.comp{font-size:12px;opacity:.7;margin-bottom:4px}
.pred{font-size:18px;font-weight:700;margin:6px 0}
.tag{display:inline-block;background:#12a15033;color:var(--ac);padding:3px 8px;border-radius:6px;font-size:13px;margin:2px 4px 2px 0}
.locked{opacity:.7}
.coupon{background:#1a1a2e;border-radius:12px;padding:12px;margin:8px 0}
.coupon h3{margin:0 0 8px;font-size:15px}
</style></head><body>
<h1>⚽ PronoStats</h1><div id="app"></div>
<small>🔞 18+ · Aucun gain garanti. Jouer comporte des risques. Aide : 09 74 75 13 13.</small>
<script>
let T=localStorage.t||"",$=s=>document.querySelector(s);
const call=async(u,b)=>{const r=await fetch(u,{method:b?"POST":"GET",headers:{"Content-Type":"application/json",Authorization:"Bearer "+T},body:b&&JSON.stringify(b)});
const j=await r.json();if(!r.ok)throw j.error||"Erreur";return j};
function login(){$("#app").innerHTML=`<div class=c><input id=e type=email placeholder="Email"><input id=p type=password placeholder="Mot de passe (8+)">
<button onclick="go('login')">Se connecter</button><button onclick="go('register')">Créer un compte</button><small id=m></small></div>`}
async function go(k){try{T=(await call("/api/"+k,{email:$("#e").value,password:$("#p").value})).token;localStorage.t=T;home()}catch(e){$("#m").textContent=e}}
async function pay(p){try{location=(await call("/api/checkout",{plan:p})).url}catch(e){alert(e)}}
async function home(){
  try{
    const me=await call("/api/me");
    let data={matches:[]};
    try{ data=await call("/api/predictions"); }catch(e){ data={matches:[]}; }
    const ps=data.matches||[];
    const coupons=data.coupons||[];

    let html=`<p>${me.email} · <b>${me.plan}</b> <a href="#" onclick="logout()">Déconnexion</a></p>`;
    if(me.plan!=="elite"){
      html+=`<div class=c><button onclick="pay('pro')">Pro 9,99 €/mois</button><button onclick="pay('elite')">Élite 19,99 €/mois</button></div>`;
    }

    if(ps.length===0){
      html+=`<div class=c>Aucun match à venir pour le moment.</div>`;
    } else {
      ps.forEach(m=>{
        if(m.locked){
          html+=`<div class="c locked"><div class=comp>${m.competition||""}</div><b>${m.home} – ${m.away}</b><br>🔒 Abonnés Pro</div>`;
        } else if(m.prediction){
          // Gratuit
          html+=`<div class=c><div class=comp>${m.competition||""}</div>
            <b>${m.home} – ${m.away}</b> <small>${new Date(m.date).toLocaleString("fr")}</small>
            <div class=pred>${m.prediction} <small>(${m.confidence}%)</small></div>
          </div>`;
        } else {
          // Pro / Elite
          html+=`<div class=c><div class=comp>${m.competition||""}</div>
            <b>${m.home} – ${m.away}</b> <small>${new Date(m.date).toLocaleString("fr")}</small>
            <div style="margin-top:8px">
              <span class=tag>🏆 ${m.winner} (${m.winnerProb}%)</span>
              <span class=tag>⚽ Total buts ≈ ${m.totalGoals}</span>
              <span class=tag>BTTS : ${m.btts} (${m.bttsProb}%)</span>
              ${m.score?`<span class=tag>🎯 Score exact : ${m.score}</span>`:""}
            </div>
            ${m.topScores?`<div style="margin-top:6px;font-size:13px">Autres scores : ${m.topScores.map(s=>s.score+" ("+Math.round(s.prob*100)+"%)").join(" · ")}</div>`:""}
          </div>`;
        }
      });
    }

    // Coupons Élite
    if(coupons.length){
      html+=`<h2 style="margin-top:24px">🔥 Coupons combinés</h2>`;
      coupons.forEach(c=>{
        html+=`<div class=coupon>
          <h3>Combiné cote ≈ ${c.target} (réelle : ${c.odd})</h3>
          <ul style="margin:0;padding-left:18px">${c.picks.map(p=>`<li>${p}</li>`).join("")}</ul>
        </div>`;
      });
    }

    $("#app").innerHTML=html;
  }catch(e){login()}
}
function logout(){localStorage.t=T="";login()}
T?home():login();
</script></body></html>
